; InkTime 相框固件 —— ESP32-S3-WROOM-1-N8R8 + GDEP073E01（7.3" 800×480 六色 Spectra 6）
;
; 本固件只针对这一块屏，不做多屏通用。屏幕参数、引脚、调色板全部按本板硬编码，
; 依据是 kicad/InkTime.kicad_pcb 的实际网表，不要照抄原项目 dai-hongtao/InkTime
; 的引脚（原板是 GPIO9-14，我们是 IO13/14/46/17/18/21）。
;
; 编译：pio run        烧录：pio run -t upload      串口：pio device monitor
; 原生 USB（IO19/20）既做烧录也做串口 —— 板子没引 UART0，所以必须开 USB CDC。

[env:inktime]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; 实测这颗模组是 N16R8：16MB quad flash + 8MB octal PSRAM。
; （原以为按 N8R8 的 8MB 配，esptool 报 "Detected flash size: 16MB" 才发现的 ——
;   按 8MB 配也能跑，但白白浪费一半空间。）
; flash 和 PSRAM 的模式不能写错，写错直接起不来。
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; 主任务栈 8KB -> 32KB。
    ; 整条流程（setup 里一路跑完）会经过 HTTPClient + WiFiClient + 一堆 String
    ; 临时对象，实测出现过 InstrFetchProhibited 崩溃（执行到非法地址），
    ; 栈被写坏是常见诱因之一。加栈是最便宜的一手预防。
    -DARDUINO_LOOP_STACK_SIZE=32768

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 版本钉死：库升级会改驱动时序和 GxEPD2 的页缓冲算法，换台机器重编就编不过
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit MAX1704X@^1.0.2
